services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sidibouzid}
      POSTGRES_USER: ${POSTGRES_USER:-sidibouzid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sidibouzid_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sidibouzid}:${POSTGRES_PASSWORD:-sidibouzid_dev_password}@db:5432/${POSTGRES_DB:-sidibouzid}
      REDIS_URL: redis://redis:6379
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
      REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-1000}
      PORT: 4000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ALLOW_DEV_AUTH: 'false'
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:5174}
      DISABLE_RATE_LIMITS: ${DISABLE_RATE_LIMITS:-false}
      REQUEST_BODY_LIMIT_BYTES: ${REQUEST_BODY_LIMIT_BYTES:-102400}
      PASSWORD_RATE_LIMIT_MAX: ${PASSWORD_RATE_LIMIT_MAX:-5}
      PASSWORD_RATE_LIMIT_WINDOW_MS: ${PASSWORD_RATE_LIMIT_WINDOW_MS:-900000}
    ports:
      - '${PORT:-4000}:4000'

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    depends_on:
      - api
    ports:
      - '5173:80'

volumes:
  postgres_data:
  redis_data:
