services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sidibouzid}
      POSTGRES_USER: ${POSTGRES_USER:-sidibouzid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sidibouzid_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build: .
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run migrate:node
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sidibouzid}:${POSTGRES_PASSWORD:-sidibouzid_dev_password}@db:5432/${POSTGRES_DB:-sidibouzid}

  api:
    build: .
    restart: unless-stopped
    deploy:
      replicas: ${API_REPLICAS:-2}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: npm start
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sidibouzid}:${POSTGRES_PASSWORD:-sidibouzid_dev_password}@db:5432/${POSTGRES_DB:-sidibouzid}
      REDIS_URL: redis://redis:6379
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
      REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-1000}
      PORT: 4000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ALLOW_DEV_AUTH: 'false'
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:5174}
      DISABLE_RATE_LIMITS: ${DISABLE_RATE_LIMITS:-false}
      REQUEST_BODY_LIMIT_BYTES: ${REQUEST_BODY_LIMIT_BYTES:-102400}
      PASSWORD_RATE_LIMIT_MAX: ${PASSWORD_RATE_LIMIT_MAX:-5}
      PASSWORD_RATE_LIMIT_WINDOW_MS: ${PASSWORD_RATE_LIMIT_WINDOW_MS:-900000}
    volumes:
      - uploads:/app/upload
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  load-balancer:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./load-balancer.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '${PORT:-4000}:80'

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    depends_on:
      - load-balancer
    ports:
      - '5173:80'

volumes:
  postgres_data:
  redis_data:
  uploads:
