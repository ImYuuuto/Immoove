services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  db:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ImmooveDB}
      MYSQL_USER: ${MYSQL_USER:-immoove-admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-Immoove_dev_root_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      TZ: UTC
    ports:
      - '127.0.0.1:${MYSQL_PORT:-53306}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent']
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build: .
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run migrate:node
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-immoove-admin}:${MYSQL_PASSWORD:-Immoove_dev_root_password}@db:3306/${MYSQL_DATABASE:-ImmooveDB}

  api:
    build: .
    restart: unless-stopped
    deploy:
      replicas: ${API_REPLICAS:-2}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: npm start
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-immoove-admin}:${MYSQL_PASSWORD:-Immoove_dev_root_password}@db:3306/${MYSQL_DATABASE:-ImmooveDB}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      REDIS_URL: redis://redis:6379
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
      REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-1000}
      PORT: 4000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ALLOW_DEV_AUTH: 'false'
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:5174}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DISABLE_RATE_LIMITS: ${DISABLE_RATE_LIMITS:-false}
      REQUEST_BODY_LIMIT_BYTES: ${REQUEST_BODY_LIMIT_BYTES:-102400}
      PASSWORD_RATE_LIMIT_MAX: ${PASSWORD_RATE_LIMIT_MAX:-5}
      PASSWORD_RATE_LIMIT_WINDOW_MS: ${PASSWORD_RATE_LIMIT_WINDOW_MS:-900000}
    volumes:
      - uploads:/app/upload
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  load-balancer:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./load-balancer.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '${PORT:-4000}:80'

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    depends_on:
      - load-balancer
    ports:
      - '5173:80'

volumes:
  mysql_data:
  redis_data:
  uploads:
