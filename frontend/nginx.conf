server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://load-balancer;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass http://load-balancer;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/categories/[a-z0-9-]+/listing/([0-9]+)/?$ {
    return 308 /listings/$1$is_args$args;
  }

  location ~ ^/categories(?:/[a-z0-9-]+)?/?$ {
    return 308 /properties$is_args$args;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
